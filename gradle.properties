# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod Properties
mod_version=1.0.0
maven_group=dev.keystrokes
archives_base_name=keystrokes

# Minecraft / Fabric versions (Minecraft Java Edition 1.21.11)
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.4
# NOTE: bumped from 0.16.14 - Fabric's own 1.21.11 dev guidance (fabricmc.net/2025/12/05/12111.html)
# names 0.18.1 as the current stable Fabric Loader; 0.16.14 predates the 1.21.11 toolchain work.
loader_version=0.18.1

# Fabric API
fabric_version=0.141.6+1.21.11

# Fabric Loom (build plugin) - requires Gradle 8.14+
# NOTE: bumped from 1.11-SNAPSHOT - Fabric's own 1.21.11 dev guidance explicitly says to use
# Loom 1.14 for this Minecraft version. UNVERIFIED: could not actually resolve this in a build
# (no network in this sandbox) - if it doesn't resolve, check https://maven.fabricmc.net/net/fabricmc/fabric-loom/
# for the current exact version string.
loom_version=1.12.7

# Optional integration (compile-time only, not a hard dependency)
modmenu_version=17.0.0
